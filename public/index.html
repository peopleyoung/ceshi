<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标书审核平台 - 登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>标书审核平台</h1>
      <p class="subtitle">上传招标文件，智能审核投标文件</p>

      <div class="auth-tabs">
        <button class="active" data-tab="login">登录</button>
        <button data-tab="register">注册</button>
      </div>

      <div id="alert-area"></div>

      <form id="auth-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="3-50位字母、数字或下划线" required minlength="3" maxlength="50" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="至少6位" required minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          登录
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    let currentTab = 'login';
    const tabs = document.querySelectorAll('.auth-tabs button');
    const form = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertArea = document.getElementById('alert-area');
    const passwordInput = document.getElementById('password');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        submitBtn.textContent = currentTab === 'login' ? '登录' : '注册';
        passwordInput.setAttribute('autocomplete', currentTab === 'login' ? 'current-password' : 'new-password');
        alertArea.innerHTML = '';
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertArea.innerHTML = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> 处理中...';

      try {
        if (currentTab === 'register') {
          await api.auth.register(username, password);
          showToast('注册成功，请登录', 'success');
          currentTab = 'login';
          tabs.forEach(t => t.classList.remove('active'));
          tabs[0].classList.add('active');
          submitBtn.textContent = '登录';
        }

        const data = await api.auth.login(username, password);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast('登录成功', 'success');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
      } catch (err) {
        const div = document.createElement('div');
        div.className = 'alert alert-danger';
        div.textContent = err.message || '操作失败';
        alertArea.appendChild(div);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentTab === 'login' ? '登录' : '注册';
      }
    });
  </script>
</body>
</html>
